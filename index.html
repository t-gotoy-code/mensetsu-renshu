<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI面接練習</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --blue:#1f6fe5; --blue-d:#1552b3; --ink:#1c2733; --sub:#5b6b7c; --line:#d5dfeb; --bg:#eef4fb; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%; }
  button, input, textarea, select { font:inherit; color:inherit; }
  .screen { display:none; min-height:100%; }
  .screen.on { display:block; }
  header { background:var(--blue); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.04em; }
  header .tag { background:#fff; color:var(--blue); font-weight:700; font-size:13px; padding:2px 10px; border-radius:6px; }
  header .right { margin-left:auto; font-size:13px; }
  .wrap { max-width:920px; margin:0 auto; padding:16px; }

  /* ---- 設定画面 ---- */
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .card h2 small { font-weight:400; color:var(--sub); margin-left:6px; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { flex:1 1 0; min-width:92px; padding:11px 8px; border:2px solid var(--line); background:#fff; border-radius:10px; cursor:pointer; font-weight:600; }
  .seg button.on { border-color:var(--blue); background:#e8f1ff; color:var(--blue-d); }
  input[type=text], textarea { width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; font-size:16px; }
  textarea { resize:vertical; min-height:84px; line-height:1.6; }
  input:focus, textarea:focus, button:focus-visible { outline:3px solid #9cc3ff; outline-offset:1px; }
  .cols { display:grid; grid-template-columns:1fr; gap:14px; }
  .preview { height:230px; border-radius:12px; overflow:hidden; background:#cfe0f3; position:relative; }
  .preview canvas { width:100%; height:100%; display:block; }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:none; transform-origin:50% 70%; will-change:transform; }
  .photo.on { display:block; }
  .photo.layer { z-index:1; opacity:0; }
  .pill, .status, .rec { z-index:2; }
  .status.talk::after { content:""; display:inline-block; width:14px; height:10px; margin-left:6px; background:
    linear-gradient(var(--blue),var(--blue)) 0 100%/3px 60% no-repeat, linear-gradient(var(--blue),var(--blue)) 5.5px 100%/3px 100% no-repeat, linear-gradient(var(--blue),var(--blue)) 11px 100%/3px 40% no-repeat; animation:bars .5s steps(2) infinite; }
  @keyframes bars { 50% { transform:scaleY(.55); transform-origin:bottom; } }
  .row { margin-bottom:12px; }
  .row:last-child { margin-bottom:0; }
  .row label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  .note { font-size:12.5px; color:var(--sub); line-height:1.7; margin:8px 0 0; }
  .primary { width:100%; padding:15px; border:0; border-radius:12px; background:var(--blue); color:#fff; font-size:17px; font-weight:700; cursor:pointer; }
  .primary:disabled { background:#9db4d3; cursor:default; }
  .err { color:#b3261e; font-size:14px; margin:8px 0 0; min-height:1em; }

  /* ---- 面接画面 ---- */
  #interview.on { display:flex; flex-direction:column; height:100%; background:var(--blue); }
  #interview header { padding:10px 14px; }
  .stage { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px; padding:0 10px; }
  .pane { position:relative; border:3px solid #fff; border-radius:18px; overflow:hidden; background:#22344d; min-height:0; }
  #paneAI { flex:3 1 0; }
  #paneMe { flex:2 1 0; }
  .pane canvas, .pane video { width:100%; height:100%; display:block; object-fit:cover; }
  #cam { transform:scaleX(-1); }
  .pill { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); background:rgba(20,28,40,.78); color:#fff; font-size:13px; font-weight:700; padding:3px 14px; border-radius:8px; white-space:nowrap; }
  .status { position:absolute; top:8px; left:8px; background:rgba(255,255,255,.92); color:var(--blue-d); font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .nocam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#c9d6e6; font-size:13px; text-align:center; padding:12px; }
  .rec { position:absolute; top:8px; right:8px; background:#d93025; color:#fff; font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px; display:none; }
  .rec.on { display:block; }
  .panel { flex:0 0 auto; background:#fff; margin-top:8px; border-radius:18px 18px 0 0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
  .qtext { font-size:15.5px; line-height:1.7; min-height:3.4em; margin:0 0 10px; }
  .qtext b { color:var(--blue-d); margin-right:6px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btns button { flex:1 1 0; padding:13px 4px; font-size:15px; white-space:nowrap; border-radius:12px; border:2px solid var(--blue); background:#fff; color:var(--blue-d); font-weight:700; cursor:pointer; min-width:0; }
  .btns button.fill { background:var(--blue); color:#fff; }
  .btns button.stop { background:#d93025; border-color:#d93025; color:#fff; }
  .btns button.ghost { border-color:var(--line); color:var(--sub); flex:0 0 auto; padding:13px 14px; }
  .btns button:disabled { opacity:.45; cursor:default; }
  #answerBox { display:none; margin-bottom:10px; }
  #answerBox.on { display:block; }
  #answerBox textarea { min-height:96px; max-height:30vh; }
  .hint { font-size:12.5px; color:var(--sub); margin:6px 0 0; }

  /* ---- 結果画面 ---- */
  .scores { display:grid; grid-template-columns:1fr; gap:8px; }
  .score { display:flex; align-items:center; gap:10px; font-size:14px; }
  .score span:first-child { flex:0 0 9.5em; }
  .bar { flex:1; height:12px; background:#e3ebf5; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); border-radius:6px; }
  .score em { font-style:normal; font-weight:700; width:2.4em; text-align:right; font-variant-numeric:tabular-nums; }
  .qa { border-top:1px solid var(--line); padding:12px 0; }
  .qa:first-of-type { border-top:0; padding-top:0; }
  .qa .q { font-weight:700; margin:0 0 6px; line-height:1.6; }
  .qa .a { background:#f4f7fb; border-radius:10px; padding:10px 12px; margin:0 0 8px; line-height:1.7; font-size:14.5px; white-space:pre-wrap; }
  .qa dl { margin:0; font-size:14.5px; line-height:1.7; }
  .qa dt { font-weight:700; color:var(--blue-d); float:left; clear:left; width:5.2em; }
  .qa dd { margin:0 0 4px 5.4em; }
  .overall { line-height:1.8; margin:0; white-space:pre-wrap; }
  ul.next { margin:0; padding-left:1.3em; line-height:1.8; }
  .loading { text-align:center; padding:48px 16px; color:var(--sub); }
  .spin { width:34px; height:34px; border:4px solid #cfdcec; border-top-color:var(--blue); border-radius:50%; margin:0 auto 14px; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  @media (min-width:760px) {
    .cols { grid-template-columns:1fr 300px; align-items:start; }
    .preview { height:300px; }
    .stage { flex-direction:row; padding:0 16px; gap:14px; }
    #paneAI, #paneMe { flex:1 1 0; }
    #paneMe { order:-1; }
    .panel { max-width:920px; width:100%; margin:12px auto 0; }
    .scores { grid-template-columns:1fr 1fr; column-gap:24px; }
  }
  @media (prefers-reduced-motion:reduce) { .spin { animation:none; } }
</style>
</head>
<body>

<!-- ================= 設定画面 ================= -->
<section id="setup" class="screen on">
  <header><h1>面接練習</h1><span class="tag">AI面接官</span></header>
  <div class="wrap">
    <div class="cols">
      <div>
        <div class="card">
          <h2>1. 面接の種類</h2>
          <div class="seg" id="segType">
            <button type="button" data-v="job" class="on">就職試験</button>
            <button type="button" data-v="ao">総合型選抜</button>
            <button type="button" data-v="suisen">学校推薦型</button>
          </div>
        </div>
        <div class="card">
          <h2>2. あなたについて</h2>
          <div class="row" id="codeRow" style="display:none">
            <label for="code">合言葉（先生から伝えられたもの）</label>
            <input type="text" id="code" maxlength="30" autocomplete="off">
          </div>
          <div class="row">
            <label for="sid">生徒番号（名前は入力しません）</label>
            <input type="text" id="sid" inputmode="latin" maxlength="20" autocomplete="off">
          </div>
          <div class="row">
            <label for="target" id="targetLabel">志望先（企業名・職種）</label>
            <input type="text" id="target" maxlength="80" autocomplete="off">
          </div>
          <div class="row">
            <label for="memo">志望理由・自己PRのメモ（書かなくても練習できます）</label>
            <textarea id="memo" maxlength="600"></textarea>
          </div>
        </div>
        <div class="card">
          <h2>3. 質問の数</h2>
          <div class="seg" id="segTotal">
            <button type="button" data-v="4">4問<br><small>約5分</small></button>
            <button type="button" data-v="6" class="on">6問<br><small>約8分</small></button>
            <button type="button" data-v="8">8問<br><small>約10分</small></button>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2>4. 面接官</h2>
          <div class="preview"><canvas id="pv"></canvas><img id="pvPhoto" class="photo" alt=""></div>
          <div class="row" style="margin-top:12px">
            <div class="seg" id="segGender">
              <button type="button" data-v="male" class="on">男性</button>
              <button type="button" data-v="female">女性</button>
            </div>
          </div>
          <div class="row">
            <div class="seg" id="segAge">
              <button type="button" data-v="young">若手</button>
              <button type="button" data-v="middle" class="on">中堅</button>
              <button type="button" data-v="senior">ベテラン</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button type="button" class="primary" id="btnStart">面接を始める</button>
    <p class="err" id="setupErr" role="alert"></p>
    <p class="note">始めるとカメラとマイクの許可を求められます。カメラの映像は自分の画面に映るだけで、送信も保存もされません。話した声は文字にするためにAIサービスへ送られ、質問・回答・講評は先生が確認できるよう記録されます。</p>
  </div>
</section>

<!-- ================= 面接画面 ================= -->
<section id="interview" class="screen">
  <header><h1>面接練習</h1><span class="tag" id="typeTag"></span><span class="right" id="progress"></span></header>
  <div class="stage">
    <div class="pane" id="paneAI">
      <canvas id="av"></canvas>
      <img id="avPhoto" class="photo" alt="">
      <span class="status" id="aiStatus">準備中</span>
      <span class="pill">AI面接官</span>
    </div>
    <div class="pane" id="paneMe">
      <video id="cam" autoplay playsinline muted></video>
      <div class="nocam" id="nocam">カメラは使われていません</div>
      <span class="rec" id="rec">● 録音中 <span id="recTime">0:00</span></span>
      <span class="pill">あなた</span>
    </div>
  </div>
  <div class="panel">
    <p class="qtext" id="qtext" aria-live="polite"></p>
    <div id="answerBox">
      <textarea id="answer" maxlength="1200" placeholder="ここに回答を入力します"></textarea>
      <p class="hint" id="answerHint"></p>
    </div>
    <div class="btns" id="btns"></div>
  </div>
</section>

<!-- ================= 結果画面 ================= -->
<section id="result" class="screen">
  <header><h1>面接練習</h1><span class="tag">講評</span></header>
  <div class="wrap" id="resultBody"></div>
</section>

<script>
'use strict';

/* =========================================================
   サーバー呼び出し（GASの外で開いたときは見本の応答を返します）
   ========================================================= */
/* ▼▼▼ 設定 ▼▼▼
   API_URL  : GASを「ウェブアプリ」としてデプロイしたときのURL（https://script.google.com/macros/s/…/exec）
   IMG_BASE : 面接官の写真を置いたフォルダ（index.html と同じ場所に images フォルダを置く場合はこのまま）
   ▲▲▲▲▲▲▲▲▲ */
const API_URL = '';
const IMG_BASE = 'images/';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
let accessCode = '';
function api(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (!IN_GAS && API_URL) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args: args, code: accessCode }) })
      .then(function (r) { if (!r.ok) throw new Error('サーバーに接続できませんでした（' + r.status + '）。'); return r.json(); },
            function () { throw new Error('サーバーに接続できませんでした。通信環境を確認してください。'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'エラーが発生しました。'); return j.result; });
  }
  if (!IN_GAS) return mockApi(name, args);
  return new Promise(function (resolve, reject) {
    const run = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(new Error(String((e && e.message) || e).replace(/^Error:\s*/, '')));
    });
    run[name].apply(run, args);
  });
}
function mockApi(name, args) {
  const qs = ['それでは面接を始めます。まず、志望した理由を教えてください。',
    'ありがとうございます。そう考えるようになったきっかけを、具体的に教えてください。',
    'ありがとうございます。高校生活で力を入れたことは何ですか。',
    'そのとき、難しかったことと、どう乗り越えたかを教えてください。',
    'あなたの長所と短所を教えてください。', '入ってから取り組みたいことは何ですか。',
    '周りの人と協力した経験を教えてください。', '最後に、伝えておきたいことや質問はありますか。'];
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (name === 'nextQuestion') resolve({ question: qs[Math.min(args[0].history.length, qs.length - 1)] });
      else if (name === 'transcribe') resolve({ text: '（見本）音声の文字起こし結果がここに入ります。' });
      else resolve({
        overall: '（見本の講評です）結論から話せており、聞き取りやすい構成でした。一方で、理由を支える具体的な場面が少ないため、経験を一つ入れると説得力が増します。',
        scores: { '結論の明確さ': 4, '具体性': 2, '志望先との結びつき': 3, '言葉づかい': 4, '話の長さ': 3 },
        items: args[0].history.map(function () { return { good: '結論を最初に述べています。', improve: '理由を支える場面を一つ加えましょう。', example: '「〜という経験から、〜と考えるようになりました」' }; }),
        next: ['結論→理由→具体例の順で話す', '1つの回答は30秒〜1分にまとめる', '志望先でやりたいことを一文で言えるようにする']
      });
    }, 900);
  });
}

/* =========================================================
   3D面接官（コードだけで生成・実写寄りの造形）
   ========================================================= */
const LOOKS = {
  male:   { young:  { hair:0x17130f, suit:0x2b3345, tie:0x27477a, skin:0xe6bd9c },
            middle: { hair:0x1c1714, suit:0x1b2132, tie:0x6d1f2a, skin:0xdcb08c },
            senior: { hair:0x9a9da3, suit:0x2a2c31, tie:0x3a3f63, skin:0xd6a988 } },
  female: { young:  { hair:0x1f1510, suit:0x232b3e, tie:0, skin:0xedc8ab },
            middle: { hair:0x2b1d15, suit:0x3a3640, tie:0, skin:0xe6bd9e },
            senior: { hair:0x8f9197, suit:0x26302f, tie:0, skin:0xdfb394 } }
};

function Avatar(canvas) {
  const T = THREE;
  const self = this;
  this.ok = false;
  if (typeof THREE === 'undefined') return;
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true }); } catch (e) { return; }
  this.ok = true;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  const lin = function (c) { return new T.Color(c).convertSRGBToLinear(); };
  const mat = function (c, r, extra) {
    const m = new T.MeshStandardMaterial({ color: lin(c), roughness: r == null ? 0.75 : r, metalness: 0 });
    if (extra) Object.keys(extra).forEach(function (k) { m[k] = extra[k]; });
    return m;
  };
  const mesh = function (g, m, x, y, z) { const o = new T.Mesh(g, m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = true; o.receiveShadow = true; return o; };
  const G = function (a) { return Math.exp(-a); };
  const sq = function (a) { return a * a; };
  const sstep = function (a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const scene = new T.Scene();
  scene.background = lin(0xc9d6e4);
  const camera = new T.PerspectiveCamera(24, 1, 0.1, 30);
  scene.add(new T.HemisphereLight(0xeaf2ff, 0x8d8478, 0.75));
  const key = new T.DirectionalLight(0xfff4e6, 1.25); key.position.set(1.5, 2.4, 1.9);
  key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -0.6; key.shadow.camera.right = 0.6; key.shadow.camera.top = 0.6; key.shadow.camera.bottom = -0.6;
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 6; key.shadow.bias = -0.0006; key.shadow.normalBias = 0.006; key.shadow.radius = 4;
  key.target.position.set(0, 1.3, 0); scene.add(key); scene.add(key.target);
  const fill = new T.DirectionalLight(0xdfe9ff, 0.45); fill.position.set(-2, 1.4, 1.6); scene.add(fill);
  const rim = new T.DirectionalLight(0xffffff, 0.7); rim.position.set(-0.8, 2.2, -2.2); scene.add(rim);

  // ---- 部屋（ピントの外れた窓の景色・机） ----
  (function room() {
    const c = document.createElement('canvas'); c.width = 192; c.height = 96;   // 低解像度で描いて拡大＝ぼかし
    const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 96); sky.addColorStop(0, '#a9c9ea'); sky.addColorStop(1, '#eef4f8');
    g.fillStyle = sky; g.fillRect(0, 0, 192, 96);
    const hs = [40, 28, 52, 22, 38, 60, 30, 46, 24, 50, 34, 56];
    for (let i = 0; i < hs.length; i++) { g.fillStyle = ['#aebdcc', '#9fb0c2', '#bcc8d4'][i % 3]; g.fillRect(i * 17 - 4, 78 - hs[i], 15, hs[i]); }
    g.fillStyle = '#8aa58c'; g.fillRect(0, 74, 192, 6);
    g.fillStyle = '#d9d5cf'; g.fillRect(0, 78, 192, 18);                              // 腰壁
    g.fillStyle = '#f1f1ef'; [30, 94, 158].forEach(function (x) { g.fillRect(x, 0, 5, 80); }); // 窓枠
    g.fillStyle = '#e4e2de'; g.fillRect(0, 0, 192, 5);
    const tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding;
    const bg = new T.Mesh(new T.PlaneGeometry(6.4, 3.2), new T.MeshBasicMaterial({ map: tex, toneMapped: false }));
    bg.position.set(0, 1.55, -2.2); scene.add(bg);
    const top = mesh(new T.BoxGeometry(2.8, 0.04, 0.9), mat(0x6b4a34, 0.45), 0, 1.0, 0.47); top.castShadow = false; scene.add(top);
    const front = mesh(new T.BoxGeometry(2.8, 0.95, 0.04), mat(0x5b3f2d, 0.6), 0, 0.49, 0.9); scene.add(front);
    const paper = mesh(new T.BoxGeometry(0.21, 0.003, 0.297), mat(0xffffff, 0.9), 0.3, 1.0215, 0.5); paper.rotation.y = -0.18; scene.add(paper);
    const pen = mesh(new T.CylinderGeometry(0.004, 0.004, 0.14, 8), mat(0x1c1c22, 0.3), 0.44, 1.025, 0.5); pen.rotation.set(Math.PI / 2, 0, 0.5); scene.add(pen);
  })();

  let root = null, head, lids = [], mouth, armR;
  this.state = 'idle';
  let talk = 0, blinkAt = 1.5, nodAt = 2.5, nodT = -1, blinkT = 1;

  // ---- 頭の形（球を変形して顔の凹凸を作る） ----
  function headFn(f, age) {
    const rx = 0.0765, ryT = 0.108, ryB = 0.118, rzF = 0.094, rzB = 0.1;
    const jaw = f ? 0.37 : 0.27, brow = f ? 0.0006 : 0.0026, fold = age === 'young' ? 0 : age === 'middle' ? 0.0011 : 0.002;

        d += brow * G(sq((py - 0.034) / 0.009)) * G(Math.pow(px / 0.06, 4));               // 眉骨
        d += 0.006 * G(sq(px / 0.0075) + sq((py - 0.008) / 0.022));                        // 鼻筋

        d += 0.0034 * G(sq(px / 0.02) + sq((py + 0.0525) / 0.0045));                       // 上唇
        d += 0.0044 * G(sq(px / 0.017) + sq((py + 0.0645) / 0.0055));                      // 下唇
        d -= 0.0024 * G(sq(px / 0.024) + sq((py + 0.0582) / 0.0026));                      // 口の線
        d += 0.004 * G(sq(px / 0.02) + sq((py + 0.096) / 0.014));                          // あご

  // ---- 髪（頭より少し大きい殻を、生え際の線で切り取る） ----
  function hairGeo(f, age) {

      if (age === 'middle') return a < 0.72 ? 0.5 : -0.8;                                    // ボブ
      const h = 0.56 + (0.02 - 0.56) * sstep(0.7, 1.2, a); return h + (-0.5 - h) * sstep(1.7, 2.3, a); // ショート

    const dirs = [];

      const dx = pos.getX(i), dy = pos.getY(i), dz = pos.getZ(i);
      dirs.push(dx, dy, dz);
      const a = Math.abs(Math.atan2(dx, dz));
      let px, py, pz;
      const hang = f && age !== 'senior' && dy < 0;
      const k = hang ? 1 / Math.max(0.35, Math.sqrt(1 - dy * dy)) : 1;                       // 下は筒状にして髪を垂らす
      const th = vol * (0.55 + 0.75 * Math.max(0, dy)) + (f && age === 'middle' && dy > 0.3 ? 0.004 * Math.max(0, Math.sin(Math.atan2(dx, dz) + 0.5)) : 0);

      const sh = 1 + 0.16 * n;

    }
    for (let i = 0; i < idx.length; i += 3) {

      const dx = (dirs[a0] + dirs[b0] + dirs[c0]) / 3, dy = (dirs[a0 + 1] + dirs[b0 + 1] + dirs[c0 + 1]) / 3, dz = (dirs[a0 + 2] + dirs[b0 + 2] + dirs[c0 + 2]) / 3;

    g.setAttribute('color', new T.BufferAttribute(C, 3));

/* =========================================================
   面接官の表示（写真があれば写真、なければ3D）
   images/male_young.jpg のように「性別_年代」の名前で置きます。
   male / female × young / middle / senior。口を開けた画像を
   male_young_talk.jpg の名前で置くと、話すときに口が動きます。

const imgCache = {};

  const exts = ['jpg', 'png', 'webp', 'jpeg'];
  imgCache[key] = new Promise(function (resolve) {
    let i = 0;
    (function next() {
      if (i >= exts.length) return resolve(null);
      const url = IMG_BASE + key + '.' + exts[i++], im = new Image();
      im.onload = function () { resolve(url); }; im.onerror = next; im.src = url;

}

  const layer = function () { const e = document.createElement('img'); e.className = 'photo layer'; e.alt = ''; box.insertBefore(e, img.nextSibling); return e; };

    self.photo = false; all.forEach(function (e) { e.classList.remove('on'); });

    if (!av.ok && box.classList.contains('preview')) box.style.display = 'none';
  }
  function preload(url) { return new Promise(function (r) { const i = new Image(); i.onload = function () { (i.decode ? i.decode() : Promise.resolve()).then(function () { r(url); }, function () { r(url); }); }; i.onerror = function () { r(null); }; i.src = url; }); }

        if (my !== token) return;

      nodAt -= dt; if (nodAt < 0) { nodAt = 2.8 + Math.random() * 3.2; nodT = 0; }
      if (nodT >= 0) { nodT += dt; y = Math.sin(Math.min(nodT / 0.7, 1) * Math.PI) * 8; if (nodT > 0.7) nodT = -1; }
    }

    const tf = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ') rotate(' + rot.toFixed(3) + 'deg)';
    all.forEach(function (e) { e.style.transform = tf; });
    // 口：話している間、音節のリズムで開き具合（0〜1）を変え、口を開けた写真の濃さで表現する
    if (st === 'talking' && hasTalk) {
      if (now > mouthUntil) {
        const r = Math.random();

const Voice = {
  ok: 'speechSynthesis' in window,
  voices: [],
  load: function () { if (this.ok) this.voices = speechSynthesis.getVoices().filter(function (v) { return /^ja/i.test(v.lang); }); },
  unlock: function () { if (!this.ok) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} },
  speak: function (text, gender, age, done) {
    let finished = false;
    const end = function () { if (finished) return; finished = true; clearTimeout(timer); done(); };
    const timer = setTimeout(end, 2500 + text.length * 260);
    if (!this.ok) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      const male = /otoya|ichiro|keita|hattori|daichi|naoki|takumi|male|男/i, female = /kyoko|haruka|nanami|ayumi|sayaka|o-?ren|mayu|shiori|female|女/i;
      const want = gender === 'male' ? male : female;
      const hit = this.voices.filter(function (v) { return want.test(v.name); })[0];
      const v = hit || this.voices[0];
      if (v) u.voice = v;
      const base = gender === 'male' ? (hit ? 0.95 : 0.6) : (hit ? 1.05 : 1.25);
      u.pitch = base + (age === 'young' ? 0.1 : age === 'senior' ? -0.12 : 0);
      u.rate = age === 'senior' ? 0.92 : age === 'young' ? 1.05 : 1.0;
      u.onend = end; u.onerror = end;

    } catch (e) { end(); }
  },
  stop: function () { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} }
};

    : 'カメラとマイクが許可されていません。アドレスバーの設定から許可して、ページを開き直してください。';

  if (n === 'NotReadableError' || n === 'AbortError') return 'カメラまたはマイクを、ほかのアプリが使っています。';

}

  }

/* ---- 録音 ---- */
function startRec() {
  Voice.stop();
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  const mime = types.filter(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0];
  try {
    recorder = new MediaRecorder(new MediaStream(stream.getAudioTracks()), mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  } catch (e) { micOK = false; ready(); return; }
  chunks = [];

  recorder.onstop = onRecStop;
  recorder.start();
  recStart = Date.now();
  $('rec').classList.add('on');
  recTimer = setInterval(function () {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('recTime').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
    if (s >= 120) stopRec();
  }, 250);
  setAI('listening', '聞いています');

}

async function onRecStop() {

  answerSec = Math.round((Date.now() - recStart) / 1000);
  const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
  if (answerSec < 2 || blob.size < 1500) { ready(); $('qtext').appendChild(hintNode('　※録音が短すぎました。もう一度話してください。')); return; }
  setAI('thinking', '聞き取り中');

  try {
    const b64 = await new Promise(function (res, rej) {
      const fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(',')[1]); }; fr.onerror = rej; fr.readAsDataURL(blob);
    });
    const r = await api('transcribe', b64, blob.type);
    typeAnswer(r.text, '聞き取った内容です（約' + answerSec + '秒）。違うところは直してから送ってください。', answerSec);

    const ul = el('ul', 'next'); fb.next.forEach(function (t) { ul.appendChild(el('li', '', t)); }); c.appendChild(ul); body.appendChild(c);
  }
  c = card('質問ごとのふり返り');
  S.history.forEach(function (h, i) {
    const it = (fb.items || [])[i] || {};
    const d = el('div', 'qa');
    d.appendChild(el('p', 'q', 'Q' + (i + 1) + '　' + h.q));
    d.appendChild(el('p', 'a', h.a + (h.sec ? '\n（約' + h.sec + '秒）' : '')));
    const dl = document.createElement('dl');
    [['良い点', it.good], ['改善点', it.improve], ['言い換え', it.example]].forEach(function (p) {
      if (!p[1]) return; dl.appendChild(el('dt', '', p[0])); dl.appendChild(el('dd', '', p[1]));
    });
    d.appendChild(dl); c.appendChild(d);
  });
  body.appendChild(c);
  body.appendChild(el('p', 'note', '表情・姿勢・声の大きさ・入退室の動きは、このアプリでは確認できません。先生との練習で見てもらいましょう。'));
  const again = el('button', 'primary', 'もう一度練習する'); again.type = 'button'; again.addEventListener('click', backToSetup); body.appendChild(again);
}
function backToSetup() { S.history = []; show('setup'); if (pvAvatar.ok) pvAvatar.resize(); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function card(title, small) {
  const c = el('div', 'card'); const h = el('h2', '', title);
  if (small) h.appendChild(el('small', '', small)); c.appendChild(h); return c;
}
</script>
</body>
</html>
